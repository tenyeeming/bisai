<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AcuNavi</title>

  <!-- ═══════════════════════════════════════════════════════════════
       這是「外殼」：只有 header、步驟軌、底部分頁列。
       每一個畫面都在 pages/ 底下，一頁一個檔（長相 + 行為都在裡面）。
       要改某一頁，開那一頁的檔就好，不用碰這裡。
       新增一頁：建 pages/xx.js，在下面加一行 <script>。

       ⚠️ 這份可以直接雙擊開（file://），所以不能用 fetch 載入片段
       ——那會被 CORS 擋掉。片段一律寫在各頁 .js 的 html 欄位。
       ═══════════════════════════════════════════════════════════════ -->

  <!-- ⚡ 只在 vendor/ 沒下載、要退回 CDN 時才用得到：先把 DNS 查詢與 TLS 握手做掉，
       等真的要抓那 16MB 時就不必再等連線建立（省數百 ms，手機網路上更明顯）。
       vendor/ 有檔的時候這行是無害的閒置提示。 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <link rel="stylesheet" href="css/tokens.css?v=20261104ui">
  <link rel="stylesheet" href="css/shell.css?v=20261104app">
  <link rel="stylesheet" href="css/responsive.css?v=20261104app">
  <!-- 電腦版型（方案 D：左側深藍側欄）。只在寬 ≥ 1024 且有滑鼠的螢幕生效，手機／平板不受影響 -->
  <link rel="stylesheet" href="css/desktop.css?v=20261104ui">

  <!-- MediaPipe 從哪裡載：規則與版本號都在 js/mp-loader.js，要先載它 -->
  <script src="js/mp-loader.js?v=20261002c"></script>

  <!-- 本機優先，沒下載過就退回 CDN（onerror）。本機檔怎麼來：node vendor/下載.js
       ⚠️ 版本號要與 mp-loader.js / vendor/下載.js 一致，
          JS 與 wasm 資產版本不匹配會偶發載入失敗，而且很難查 -->
  <script src="vendor/mediapipe/hands/hands.js"
          onerror="mpFallback(this,'hands','hands.js')"></script>
  <script src="vendor/mediapipe/camera_utils/camera_utils.js"
          onerror="mpFallback(this,'camera_utils','camera_utils.js')"></script>
  <!-- 臉部用另一個模型 -->
  <script src="vendor/mediapipe/face_mesh/face_mesh.js"
          onerror="mpFallback(this,'face_mesh','face_mesh.js')"></script>
  <!-- 前臂內關用 Pose（肘點＋人體遮罩）；模型只在進內關按摩頁才下載 -->
  <script src="vendor/mediapipe/pose/pose.js"
          onerror="mpFallback(this,'pose','pose.js')"></script>

  <!-- 手部定位公式（正式版的複本）。⚠️ 改這兩支要回頭同步 网页版_2d -->
  <script src="js/acu-data.js?v=20261106b"></script>
  <script src="js/acu-math.js?v=20261105e"></script>

  <!-- 臉部定位（另一套資料與公式）。⚠️ 改 face-math.js 要同步 臉部/face_acu.py -->
  <script src="js/face-data.js?v=20261106b"></script>
  <script src="js/face-sheet.js?v=20261002c"></script>
  <script src="js/face-math.js?v=20261002c"></script>
  <script src="js/face-anchor.js?v=20261104c"></script>
  <script src="js/forearm-data.js?v=20261102b"></script>
  <!-- 臉部按摩的對準判定（跨兩個模型，不是定位公式，所以獨立一支） -->
  <script src="js/face-gate.js?v=20261002c"></script>

  <!-- 共用 -->
  <script src="js/i18n.js?v=20261105e"></script>
  <script src="js/state.js?v=20261107a"></script>
  <script src="js/calib.js?v=20261106c"></script>
  <script src="js/regions.js?v=20261105b"></script>
  <script src="js/minions.js?v=20261104app"></script>
  <script src="js/acu-ref.js?v=20261002c"></script>
  <script src="js/acu-video.js?v=20261002c"></script>
  <script src="js/splash.js?v=20261104app"></script>
  <script src="js/nav.js?v=20261104app"></script>
  <script src="js/session-menu.js?v=20261101calib"></script>
  <script src="js/vision.js?v=20261106a"></script>
  <!-- 2026-11-04 臉部改跑 Tasks FaceLandmarker（官方矩陣 → 左右／上下回正，同 App）；載不起來退回上面的 FaceMesh -->
  <script src="js/face-tasks.js?v=20261104c"></script>
  <script src="js/face-vision.js?v=20261106a"></script>
  <script src="js/forearm-vision.js?v=20261106c"></script>

  <!-- 一頁一檔：順序＝療程順序 -->
  <script src="pages/01-home.js?v=20261104app"></script>
  <script src="pages/02-recommend.js"></script>
  <script src="pages/03-acu-detail.js?v=20261104app"></script>
  <script src="pages/04-camera.js?v=20261107a"></script>
  <script src="pages/05-massage.js?v=20261106b"></script>
  <script src="pages/06-complete.js"></script>
  <script src="pages/07-face.js"></script>
  <script src="pages/08-summary.js?v=20261031c"></script>
  <script src="pages/tab-gallery.js?v=20261107a"></script>
  <script src="pages/tab-gallery-info.js"></script>
  <script src="pages/tab-settings.js?v=20261104app"></script>
  <!-- 設定的子頁：一個功能一頁，目錄在 tab-settings.js -->
  <script src="pages/settings-lang.js?v=20261031c"></script>
  <script src="pages/settings-display.js?v=20261107a"></script>
  <script src="pages/settings-notify.js?v=20261031c"></script>
  <script src="pages/settings-accuracy.js"></script>
  <script src="pages/settings-flow.js?v=20261104app"></script>
</head>

<body>
  <div class="device">
    <div class="bezel"></div>

    <!-- 2026-10-31 方案 D：電腦版左側欄（js/nav.js renderSidenav 畫內容）。手機／平板 display:none -->
    <aside class="sidenav" id="sidenav" aria-label="導覽"></aside>

    <!-- 功能全在底部分頁列，語言在「設定」裡，所以 header 只剩品牌 -->
    <header>
      <div class="wordmark">Acu<span>Navi</span></div>
    </header>

    <!-- 返回列：在步驟軌上面。哪一頁要顯示、退到哪裡，看各頁註冊的 backTo。
         右邊是動作區，各頁用 registerPage 的 actions 掛自己的按鈕（如按摩頁的齒輪） -->
    <div class="backbar" id="backbar">
      <!-- 2026-11-04 同 App 批 158：膠囊（分頁列同色）＋箭頭圖示（App ic_back.xml 原樣）＋白字。
           字由 js/nav.js updateBackbar 填進 .back-label（去掉 i18n 字串前面的「← 」），所以這裡不掛 data-i18n -->
      <button class="back" id="back-btn" onclick="goBack()"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5,5.5 L8,12 L14.5,18.5"/></svg><span class="back-label">返回</span></button>
      <div class="backbar-actions" id="backbar-actions"></div>
    </div>

    <!-- 步驟軌由 js/nav.js 依各頁註冊的 step 欄位自動生成 -->
    <ol class="steprail" id="steprail"></ol>
    <div class="step-progress" id="step-progress" hidden>
      <div class="step-heading"><strong id="step-title"></strong><span class="step-count" id="step-count"></span></div>
      <div class="step-track" id="step-track" role="progressbar" aria-label="療程進度" aria-valuemin="0" aria-valuemax="4"><div class="step-fill" id="step-fill"></div></div>
    </div>

    <!-- MediaPipe 的 Camera 需要真的 video 元素，不能餵 canvas -->
    <video id="hidden-video" playsinline muted></video>

    <!-- 各頁的 html 會在開站時串起來塞進這裡（見 js/nav.js 的 boot） -->
    <main id="pages"></main>

    <!-- 2026-09-24：「個人」分頁拿掉（網頁不存紀錄，那頁全是連續天數／排行／等級），剩三個 -->
    <!-- 2026-09-25（網頁v2 批 A）：照 App（AcuScaffold.TabBar）只留文字、拿掉圖示 -->
    <!-- 2026-11-04：同 App 批 150 改回圖示（App res/drawable/ic_tab_*.xml 原樣），文字留給讀屏 -->
    <nav class="tabbar" id="tabbar" aria-label="主功能">
      <button type="button" data-tab="home" onclick="goTab('home')">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12,3.6 L20.4,11 L18.4,11 L18.4,20 L14.6,20 L14.6,16 A2.6,2.6 0 0,0 9.4,16 L9.4,20 L5.6,20 L5.6,11 L3.6,11 Z"/></svg><span class="tab-label" data-i18n="nav-home">首頁</span>
      </button>
      <button type="button" data-tab="gallery" onclick="goTab('gallery')">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.2,6.6 Q3.2,5 4.8,5 L9.6,5 Q11.2,5 11.2,6.6 L11.2,19.4 Q7.6,17.9 3.2,18.7 Z"/><path d="M20.8,6.6 Q20.8,5 19.2,5 L14.4,5 Q12.8,5 12.8,6.6 L12.8,19.4 Q16.4,17.9 20.8,18.7 Z"/><path d="M11.2,17.8 L12.8,17.8 L12.8,19.4 Q12,20.4 11.2,19.4 Z"/></svg><span class="tab-label" data-i18n="nav-gallery">圖冊</span>
      </button>
      <button type="button" data-tab="settings" onclick="goTab('settings')">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path fill-rule="evenodd" d="M9.38,5.51 L9.68,2.69 L14.32,2.69 L14.62,5.51 L16.31,6.48 L18.91,5.33 L21.23,9.35 L18.93,11.03 L18.93,12.97 L21.23,14.65 L18.91,18.67 L16.31,17.52 L14.62,18.49 L14.32,21.31 L9.68,21.31 L9.38,18.49 L7.69,17.52 L5.09,18.67 L2.77,14.65 L5.07,12.97 L5.07,11.03 L2.77,9.35 L5.09,5.33 L7.69,6.48 Z M15.9,12 A3.9,3.9 0 1,0 8.1,12 A3.9,3.9 0 1,0 15.9,12 Z"/></svg><span class="tab-label" data-i18n="nav-settings">設定</span>
      </button>
    </nav>
  </div>
</body>
</html>
